<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
  <link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

        <style>

            body {
           margin: 0;
           background-color: #91c2cc;
           font-family: 'Montserrat', sans-serif;
           color: #252525;
       }

       .inner{
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            background-color: #e19b72;
            height: 75px;
            padding: 18px;
       }

             .shop {
            width: 500px;
            height: 500px;
           margin: 80px auto;
           background-color: #f8eee8;
           padding: 50px 35px 35px;
           box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
       }

       .generate-button {
           display: block;
           margin: 30px auto 0;
           background-color: #000000;
           color: #f4f0f0;
           border: none;
           border-radius: 20px;
           padding: 10px 35px;
           font-family: 'Montserrat', sans-serif;
           font-size: 10px;
           letter-spacing: 1px;
           text-transform: uppercase;
           transition: 0.2s;
       }


       .generate-button:hover {
           background-color: #1f16d2;
           transform: translateY(-1px);
       }
        </style>
</head>
<body>

    <div class="shop rounded-5">
        <div class="form-group">

            <div>
                <h1 class="text-center">
                    Rainbow Catering Club
                </h1>
            </div>
                   <label for="First Name" class="form-label">First Name</label>
                   <input type="text" id="First-Name" class="form-control" placeholder="e.g. Nathan">
                   <br>
                    <label for="Last Name" class="form-label">Last Name</label>
                    <input type="text" id="Last-Name" class="form-control" placeholder="e.g. Ladion">
               </div>


               <button type="button" py-click="check" class="generate-button">
                   Enter
               </button>
               <br>
               <br>
               <br>
             <div id="output" class="rounded text-center inner">Results</div>
    </div>
     <script type="py" src="main.py"></script>
</body>
</html>
